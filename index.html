<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MB-WP Pay V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172033;font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#172033;color:#fff;font-weight:700}button.secondary{background:#e7ebf4;color:#172033}button.danger{background:#d44b55}input,select,textarea{width:100%;padding:10px;border:1px solid #d8ddea;border-radius:8px;background:#fff}.shell{max-width:1240px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:20px}.brand{font-weight:900;font-size:21px}.brand span{color:#df8a18}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{background:transparent;color:#526079}.nav button.active{background:#172033;color:white}.card{background:white;border:1px solid #e5e8f0;border-radius:14px;padding:18px;box-shadow:0 2px 10px #17203308}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(5,1fr)}.metric b{display:block;font-size:25px;margin-top:8px}.muted{color:#68738a}.two{grid-template-columns:1fr 1fr}.products{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.product{display:flex;flex-direction:column;gap:8px;padding:0;overflow:hidden}.product h3{margin:0;font-size:16px}.product-body{padding:0 14px 14px}.product-cover{height:125px;display:grid;place-items:center;background:linear-gradient(135deg,#1e2b49,#df8a18);font-size:45px;color:#fff}.product-cover img{width:100%;height:100%;object-fit:cover}.price{font-weight:900;font-size:18px;color:#bf6710}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #edf0f5;text-align:left}th{color:#68738a;font-size:12px;text-transform:uppercase}.status{font-size:12px;font-weight:800;padding:5px 8px;border-radius:20px;background:#fff0d9;color:#a45a00;display:inline-block}.SERVED{background:#ddf6e8;color:#187a45}.CANCELLED{background:#fee7e8;color:#aa2430}.READY{background:#e3efff;color:#155bb0}.order{border-left:5px solid #df8a18}.order header{display:flex;justify-content:space-between;font-weight:800}.order ul{padding-left:20px;margin:12px 0}.kitchen{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:start}.cart{position:sticky;top:12px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.right{text-align:right}.small{font-size:12px}.hidden{display:none!important}.login{max-width:420px;margin:11vh auto}.tabs{display:flex;gap:8px;margin-bottom:15px;overflow:auto}.tabs button{white-space:nowrap}.menu-tabs button{min-width:135px}.empty{padding:30px;text-align:center;color:#68738a}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:white;padding:13px 17px;border-radius:9px;z-index:5}.qr{font-family:monospace;word-break:break-all;background:#f5f7fb;padding:10px;border-radius:8px}.role{font-size:12px;background:#e8efff;color:#155bb0;padding:4px 8px;border-radius:20px}.qty{display:flex;align-items:center;gap:8px}.qty button{padding:3px 9px}.section-title{margin:4px 0 14px}@media(max-width:800px){.shell{padding:12px}.metrics,.two{grid-template-columns:1fr 1fr}.metrics .metric:last-child{grid-column:span 2}.client-layout{grid-template-columns:1fr!important}.cart{position:static}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}table{font-size:12px}td,th{padding:7px}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s), app=$('#app');let me=null,data=null,cart=[],view='client',laneId='l1',category='all',menu='all',kioskMode=false;
const baseClient=client;client=function(){if(data?.payment)data.payment.cicEnabled=!!data.payment.stripeEnabled;baseClient();const subtitle=document.querySelector('.client-layout section .card .small.muted'),pay=[...document.querySelectorAll('button')].find(x=>x.textContent.includes('Payer par carte')),laneSelect=document.querySelector('.client-layout select'),note=$('#note');if(note&&!$('#customerFirstName'))note.insertAdjacentHTML('beforebegin','<input id="customerFirstName" maxlength="50" autocomplete="given-name" placeholder="Prénom pour la commande" style="margin-top:14px" required>');if(kioskMode&&laneSelect)laneSelect.disabled=true;if(subtitle&&data?.payment?.stripeEnabled)subtitle.textContent='Paiement CB sécurisé par Stripe';if(pay){pay.setAttribute('onclick','payStripe()');const info=pay.nextElementSibling;if(info)info.textContent='Vous serez redirigé vers la page sécurisée Stripe.'}};
const euro=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let j=await r.json().catch(()=>null);if(!r.ok)throw Error(j?.error||'Erreur serveur');return j}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}
function topbar(){return `<div class="top"><div><div class="brand">MB-WP <span>Pay</span> <small class="muted">V2 · Démo cloud</small></div><div class="small muted">${data?.venue?.name||'Madiana Bowling'}</div></div>${kioskMode?'':`<div class="nav"><button class="${view==='client'?'active':''}" onclick="go('client')">📱 Client</button>${me?`<button class="${view==='kitchen'?'active':''}" onclick="go('kitchen')">👨‍🍳 Bar / Cuisine</button><button class="${view==='admin'?'active':''}" onclick="go('admin')">⚙️ Back-office</button><button class="secondary" onclick="logout()">Déconnexion</button>`:`<button class="${view==='login'?'active':''}" onclick="go('login')">Connexion équipe</button>`}</div>`}</div>`}
function render(){app.innerHTML=`<main class="shell">${topbar()}<div id="page"></div></main>`;({client:client,login:login,kitchen:kitchen,admin:admin}[view]||client)()};function go(v){if(kioskMode&&v!=='client')return;view=v;render()}
async function load(){data=await api('/api/admin/bootstrap');render()}
function client(){let p=data?.products||[],c=data?.categories||[];if(!data)return publicLoad();let roots=c.filter(x=>x.active&&!x.parentId).sort((a,b)=>a.sort-b.sort),activeMenu=menu==='all'?(roots[0]?.id||'all'):menu,subs=c.filter(x=>x.active&&x.parentId===activeMenu).sort((a,b)=>a.sort-b.sort),allowed=category!=='all'?[category]:subs.map(x=>x.id),cp=p.filter(x=>x.active&&(allowed.length?allowed.includes(x.categoryId):true));let current=c.find(x=>x.id===category),headline=current?.name||roots.find(x=>x.id===activeMenu)?.name||'Nos produits',paymentReady=!!data.payment?.cicEnabled;$('#page').innerHTML=`<div class="grid client-layout" style="grid-template-columns:1fr 330px"><section><div class="card"><div class="row"><div><b>🎳 Commander à la piste</b><div class="small muted">${paymentReady?'Paiement CB sécurisé par CIC / Monetico':'Menu digital · paiement en cours de configuration'}</div></div><select onchange="laneId=this.value">${data.lanes.filter(l=>l.active).map(l=>`<option value="${l.id}" ${l.id===laneId?'selected':''}>Piste ${l.number}</option>`).join('')}</select></div></div><div class="tabs menu-tabs" style="margin-top:14px">${roots.map(x=>`<button class="${activeMenu===x.id?'':'secondary'}" onclick="menu='${x.id}';category='all';render()">${x.icon} ${esc(x.name)}</button>`).join('')}</div>${subs.length?`<div class="tabs"><button class="${category==='all'?'':'secondary'}" onclick="category='all';render()">Tout</button>${subs.map(x=>`<button class="${category===x.id?'':'secondary'}" onclick="category='${x.id}';render()">${esc(x.name)}</button>`).join('')}</div>`:''}<h2 class="section-title">${esc(headline)}</h2><div class="grid products">${cp.map(x=>`<article class="card product"><div class="product-cover">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.name)}">`:x.name.slice(0,1)}</div><div class="product-body"><div class="small muted">${x.featured?'⭐ Vedette · ':''}${esc(x.sku)}</div><h3>${esc(x.name)}</h3><p class="small muted">${esc(x.description||'Description à compléter dans le back-office.')}</p><div class="row"><div class="price">${euro(x.priceTtc)}</div><button onclick="add('${x.id}')" ${x.stock<1?'disabled':''}>Choisir</button></div></div></article>`).join('')||'<div class="empty">Aucun produit dans cette catégorie.</div>'}</div></section><aside class="card cart"><h2 class="section-title">🛒 Mon panier</h2>${cart.length?cart.map(i=>`<div class="row" style="margin:10px 0"><div><b>${esc(i.name)}</b><div class="small muted">${euro(i.priceTtc)}</div></div><div class="qty"><button class="secondary" onclick="adjust('${i.id}',-1)">−</button><b>${i.qty}</b><button class="secondary" onclick="adjust('${i.id}',1)">+</button></div></div>`).join(''):'<div class="empty">Votre panier est vide.</div>'}<hr><div class="row"><b>Total TTC</b><b class="right price">${euro(cart.reduce((s,i)=>s+i.qty*i.priceTtc,0))}</b></div><textarea id="note" placeholder="Note pour le bar (facultatif)" style="margin:14px 0"></textarea>${paymentReady?`<button style="width:100%" onclick="payCic()" ${cart.length?'':'disabled'}>🔒 Payer par carte</button><p class="small muted">Vous serez redirigé vers la page sécurisée CIC.</p>`:`<button style="width:100%" onclick="order()" ${cart.length?'':'disabled'}>Envoyer la commande</button><p class="small muted">Le paiement CB sera activé après configuration Monetico.</p>`}</aside></div>`}
async function publicLoad(){let d=await api('/api/public/catalog');data={...d,orders:[],audit:[]};render();if(!d.payment?.stripeEnabled){let b=[...document.querySelectorAll('button')].find(x=>x.textContent.includes('Envoyer la commande'));if(b){b.disabled=true;b.textContent='🔒 Paiement Stripe à configurer';b.onclick=()=>toast('Configurez Stripe puis redémarrez le serveur.');let info=b.nextElementSibling;if(info)info.textContent='Le paiement CB sera activé après configuration de Stripe.'}}}function add(id){let p=data.products.find(x=>x.id===id),i=cart.find(x=>x.id===id);if(i){if(i.qty<p.stock)i.qty++}else cart.push({...p,qty:1});render()}function adjust(id,n){let i=cart.find(x=>x.id===id);i.qty+=n;if(i.qty<1)cart=cart.filter(x=>x.id!==id);render()}
async function order(){try{let o=await api('/api/public/orders',{method:'POST',body:JSON.stringify({laneId,items:cart.map(i=>({productId:i.id,qty:i.qty})),note:$('#note').value})});cart=[];toast(`Commande #${o.number} envoyée au bar !`);await publicLoad()}catch(e){toast(e.message)}}
async function payStripe(){try{let customerFirstName=$('#customerFirstName')?.value.trim();if(!customerFirstName)return toast('Indiquez le prénom de la commande.');let o=await api('/api/public/orders',{method:'POST',body:JSON.stringify({laneId,items:cart.map(i=>({productId:i.id,qty:i.qty})),note:$('#note').value,customerFirstName,paymentMethod:'STRIPE'})});let payment=await api('/api/public/payments/stripe',{method:'POST',body:JSON.stringify({orderId:o.id})});location.assign(payment.url)}catch(e){toast(e.message)}}
async function payCic(){try{let o=await api('/api/public/orders',{method:'POST',body:JSON.stringify({laneId,items:cart.map(i=>({productId:i.id,qty:i.qty})),note:$('#note').value,paymentMethod:'CIC'})});let payment=await api('/api/public/payments/cic',{method:'POST',body:JSON.stringify({orderId:o.id})});let form=document.createElement('form');form.method='POST';form.action=payment.action;Object.entries(payment.fields).forEach(([name,value])=>{let input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;form.appendChild(input)});document.body.appendChild(form);form.submit()}catch(e){toast(e.message)}}
function login(){$('#page').innerHTML=`<section class="card login"><h1>Connexion équipe</h1><p class="muted">Accès au bar/cuisine et au back-office.</p><form onsubmit="signIn(event)"><label>Email<input id="email" value="admin@mbwp.demo" type="email"></label><br><label>Mot de passe<input id="password" value="Demo2026!" type="password"></label><br><button>Se connecter</button></form><p class="small muted">Admin : admin@mbwp.demo<br>Bar : bar@mbwp.demo<br>Mot de passe : Demo2026!</p></section>`}async function signIn(e){e.preventDefault();try{me=(await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})})).user;await load();view='admin';render()}catch(e){toast(e.message)}}async function logout(){await fetch('/api/logout');me=null;view='client';await publicLoad()}
function kitchen(){let os=data.orders.filter(o=>['NEW','PREPARING','READY'].includes(o.status));$('#page').innerHTML=`<h1>👨‍🍳 Bar / Cuisine <small class="muted">${os.length} en cours</small></h1><div class="grid kitchen">${os.map(o=>`<article class="card order"><header><span>#${o.number} · Piste ${o.lane}</span><span class="status ${o.status}">${label(o.status)}</span></header><div class="small muted">${new Date(o.createdAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div><ul>${o.items.map(i=>`<li><b>${i.qty} ×</b> ${esc(i.name)}</li>`).join('')}</ul>${o.note?`<p class="small">Note : ${esc(o.note)}</p>`:''}<div class="row"><select onchange="setStatus('${o.id}',this.value)">${['NEW','PREPARING','READY','SERVED'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${label(s)}</option>`).join('')}</select></div></article>`).join('')||'<div class="empty card">Aucune commande à préparer.</div>'}</div>`}
const label=s=>({NEW:'Nouvelle',PREPARING:'En préparation',READY:'Prête',SERVED:'Servie',CANCELLED:'Annulée'})[s]||s;async function setStatus(id,status){try{await api('/api/admin/orders',{method:'PATCH',body:JSON.stringify({id,status})});await load()}catch(e){toast(e.message)}}
function admin(){if(!me)return go('login');let can=me.role!=='KITCHEN';$('#page').innerHTML=`<div class="tabs"><button onclick="adminTab('dash')">Tableau de bord</button><button onclick="adminTab('orders')">Commandes</button>${can?'<button onclick="adminTab(\'products\')">Produits</button><button onclick="adminTab(\'categories\')">Catégories</button><button onclick="adminTab(\'lanes\')">Pistes / QR</button>':''}${me.role==='ADMIN'?'<button onclick="adminTab(\'users\')">Utilisateurs</button><button onclick="adminTab(\'settings\')">Paramètres</button>':''}<button onclick="adminTab('audit')">Journal</button></div><div id="admin-content"></div>`;adminTab(window.adminActive||'dash')}
function adminTab(t){window.adminActive=t;let e=$('#admin-content'),d=data.dashboard;if(t==='dash')e.innerHTML=`<h1>Tableau de bord <span class="role">${me.role}</span></h1><div class="grid metrics">${[['Commandes',d.orders],['CA TTC',euro(d.revenue)],['Panier moyen',euro(d.average)],['À traiter',d.open],['Produits actifs',d.activeProducts]].map(x=>`<div class="card metric"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card" style="margin-top:15px"><h2>Dernières commandes</h2>${ordersTable(data.orders.slice(0,6))}</div>`;
else if(t==='orders')e.innerHTML=`<h1>Commandes</h1><div class="card">${ordersTable(data.orders)}</div>`;
else if(t==='products')e.innerHTML=`<div class="two grid"><section class="card"><h2>Ajouter un produit</h2>${productForm()}</section><section class="card"><h2>Catalogue client</h2><div style="overflow:auto"><table><tr><th>Produit</th><th>Catégorie</th><th>HT/TTC</th><th>TVA</th><th>Marge</th><th>Stock</th><th></th></tr>${data.products.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="small muted">${esc(p.sku)} ${p.featured?'· ⭐ Vedette ':''}${p.active?'':'· Inactif'}</span></td><td>${esc(data.categories.find(c=>c.id===p.categoryId)?.name||'—')}</td><td>${euro(p.priceHt)}<br><b>${euro(p.priceTtc)}</b></td><td>${p.taxRate}%</td><td>${euro(p.priceHt-p.cost)}</td><td>${p.stock}</td><td><button class="secondary" onclick="editProduct('${p.id}')">Modifier</button></td></tr>`).join('')}</table></div></section></div>`;
else if(t==='categories')e.innerHTML=`<div class="two grid"><form class="card" onsubmit="newCategory(event)"><h2>Structure du menu</h2><p class="small muted">Créez un univers, puis ses sous-catégories. Les produits sont rattachés aux sous-catégories.</p><input id="cn" placeholder="Nom" required><br><input id="ci" placeholder="Icône" value="📦"><br><select id="cp"><option value="">Univers principal (niveau 1)</option>${data.categories.filter(c=>!c.parentId).map(c=>`<option value="${c.id}">Sous-catégorie de ${esc(c.name)}</option>`).join('')}</select><br><input id="cs" type="number" value="${data.categories.length+1}" placeholder="Ordre"><br><button>Ajouter au menu</button></form><div class="card"><h2>Menu client</h2>${data.categories.filter(c=>!c.parentId).sort((a,b)=>a.sort-b.sort).map(c=>`<p>${c.icon} <b>${esc(c.name)}</b> <span class="muted">univers</span>${data.categories.filter(x=>x.parentId===c.id).sort((a,b)=>a.sort-b.sort).map(s=>`<br><span class="muted">　└ ${s.icon} ${esc(s.name)}</span>`).join('')}</p>`).join('')}</div></div>`;
else if(t==='lanes')e.innerHTML=`<h1>Pistes & QR Codes</h1><div class="grid products">${data.lanes.map(l=>`<article class="card"><h2>🎳 Piste ${l.number}</h2><p><span class="status ${l.active?'SERVED':'CANCELLED'}">${l.active?'Active':'Inactive'}</span></p><div class="qr">${location.origin}/?lane=${l.number}&token=${l.token}</div><p class="small muted">Lien à encoder dans le QR Code de la piste.</p><button class="secondary" onclick="lane('${l.id}',${!l.active})">${l.active?'Désactiver':'Activer'}</button></article>`).join('')}</div>`;
else if(t==='users')e.innerHTML=`<div class="two grid"><form class="card" onsubmit="newUser(event)"><h2>Nouvel utilisateur</h2><input id="un" placeholder="Nom" required><br><input id="ue" type="email" placeholder="Email" required><br><input id="up" placeholder="Mot de passe" required><br><select id="ur"><option>MANAGER</option><option>KITCHEN</option><option>ADMIN</option></select><br><button>Créer</button></form><div class="card"><h2>Utilisateurs</h2>${data.users.map(u=>`<p><b>${esc(u.name)}</b> <span class="role">${u.role}</span><br><span class="muted">${esc(u.email)}</span></p>`).join('')}</div></div>`;
else if(t==='settings')e.innerHTML=`<form class="card" onsubmit="settings(event)"><h1>Paramètres établissement</h1><label>Nom<input id="vn" value="${esc(data.venue.name)}"></label><p><label><input id="vt" type="checkbox" ${data.venue.taxIncluded?'checked':''} style="width:auto"> Les prix affichés au client sont TTC</label></p><p class="muted">Devise : EUR · La TVA reste paramétrée par produit.</p><button>Enregistrer</button></form>`;
else e.innerHTML=`<h1>Journal des actions</h1><div class="card"><table><tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Détail</th></tr>${data.audit.map(a=>`<tr><td>${new Date(a.at).toLocaleString('fr-FR')}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</table></div>`}
function ordersTable(os){return `<table><tr><th>#</th><th>Piste</th><th>Contenu</th><th>Total</th><th>Statut</th></tr>${os.map(o=>`<tr><td><b>#${o.number}</b><br><span class="small muted">${new Date(o.createdAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span></td><td>Piste ${o.lane}</td><td>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(', ')}</td><td>${euro(o.total.ttc)}</td><td><select onchange="setStatus('${o.id}',this.value)">${['NEW','PREPARING','READY','SERVED','CANCELLED'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${label(s)}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Aucune commande.</td></tr>'}</table>`}
function productForm(){let leaf=data.categories.filter(c=>c.parentId);return `<form onsubmit="newProduct(event)"><input id="ps" placeholder="SKU / référence" required><br><input id="pn" placeholder="Nom du produit" required><br><textarea id="pd" placeholder="Description visible au client"></textarea><br><input id="pi" placeholder="URL de la photo (facultatif)"><br><select id="pc">${leaf.map(c=>`<option value="${c.id}">${esc(data.categories.find(x=>x.id===c.parentId)?.name||'')} → ${esc(c.name)}</option>`).join('')}</select><br><label class="small"><input id="pf" type="checkbox" style="width:auto"> Mettre en vedette</label><br><div class="row"><input id="pp" type="number" step=".01" value="0" placeholder="Prix HT"><select id="pt">${[0,2.1,5.5,8.5,10,20].map(t=>`<option ${t===20?'selected':''}>${t}</option>`).join('')}</select></div><p class="small muted">Prix HT et taux de TVA (%)</p><div class="row"><input id="pco" type="number" step=".01" value="0" placeholder="Coût achat"><input id="pst" type="number" value="0" placeholder="Stock"></div><br><button>Créer le produit</button></form>`}
async function newProduct(e){e.preventDefault();try{await api('/api/admin/products',{method:'POST',body:JSON.stringify({sku:ps.value,name:pn.value,description:pd.value,image:pi.value,featured:pf.checked,categoryId:pc.value,priceHt:pp.value,taxRate:pt.value,cost:pco.value,stock:pst.value})});toast('Produit ajouté au menu');await load()}catch(e){toast(e.message)}}async function editProduct(id){let p=data.products.find(x=>x.id===id),name=prompt('Nom du produit',p.name);if(name===null)return;let description=prompt('Description client',p.description||'');if(description===null)return;let image=prompt('URL de la photo (laisser vide pour le visuel par défaut)',p.image||'');if(image===null)return;let stock=prompt('Stock',p.stock);if(stock===null)return;try{await api('/api/admin/products/'+id,{method:'PATCH',body:JSON.stringify({...p,name,description,image,stock,featured:confirm('Mettre ce produit en vedette ?')})});await load()}catch(e){toast(e.message)}}async function newCategory(e){e.preventDefault();try{await api('/api/admin/categories',{method:'POST',body:JSON.stringify({name:cn.value,icon:ci.value,parentId:cp.value,sort:cs.value})});await load()}catch(e){toast(e.message)}}async function lane(id,active){await api('/api/admin/lanes',{method:'PATCH',body:JSON.stringify({id,active})});await load()}async function newUser(e){e.preventDefault();try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({name:un.value,email:ue.value,password:up.value,role:ur.value})});await load()}catch(e){toast(e.message)}}async function settings(e){e.preventDefault();await api('/api/admin/settings',{method:'PATCH',body:JSON.stringify({name:vn.value,taxIncluded:vt.checked})});await load()}
async function init(){let q=new URLSearchParams(location.search);if(q.get('lane')&&/^([1-8])$/.test(q.get('lane'))){laneId='l'+q.get('lane');kioskMode=true;me=null;view='client';try{await publicLoad()}catch(e){app.innerHTML=`<main class="shell"><section class="card login"><h1>MB-WP Pay indisponible</h1><p>${esc(e.message)}</p></section></main>`}return}try{me=await api('/api/me');await load();let es=new EventSource('/api/events');es.addEventListener('changed',async()=>{if(me)await load()})}catch{try{await publicLoad()}catch(e){app.innerHTML=`<main class="shell"><section class="card login"><h1>MB-WP Pay indisponible</h1><p>Le site ne trouve pas son serveur applicatif.</p><p class="muted">Cette application a besoin du serveur Node.js (<code>server.js</code>) pour ses menus, commandes, paiements et le back-office. Un simple dépôt FTP ne suffit pas.</p><p class="small muted">Détail : ${esc(e.message)}</p></section></main>`}}}init();
</script><script>
let salesPeriod='day',salesCustomFrom='',salesCustomTo='';
const qrLocationParams=new URLSearchParams(location.search);
if(qrLocationParams.get('location')){laneId=qrLocationParams.get('location');kioskMode=true;view='client';me=null}
const adminWithoutOptionSets=admin;
admin=function(){adminWithoutOptionSets();if(me&&me.role!=='KITCHEN'){let tabs=document.querySelector('#page>.tabs');if(tabs&&!tabs.querySelector('[data-option-sets]')){let button=document.createElement('button');button.dataset.optionSets='1';button.textContent="Jeux d'options";button.onclick=()=>adminTab('option-sets');tabs.appendChild(button)}}};
const coreAdminTab=adminTab;
adminTab=function(t){if(t==='dash'){window.adminActive=t;renderSalesDashboard(salesPeriod);return}if(t==='categories'){window.adminActive=t;renderCategoryManager();enhanceCategorySearch();return}if(t==='option-sets'){window.adminActive=t;renderOptionSetManager();return}if(t==='lanes'){window.adminActive=t;renderQrLocations();return}if(t==='settings'){window.adminActive=t;renderPrinterSettings();renderPaymentStatus();return}coreAdminTab(t);if(t==='products')enhanceProductManager()};
function enhanceProductManager(){let cards=document.querySelectorAll('#admin-content .card'),catalog=cards[cards.length-1],table=catalog?.querySelector('table');if(!catalog||!table)return;let search=document.createElement('div');search.innerHTML=`<label>Rechercher un produit<input id="productSearch" list="productSuggestions" placeholder="Nom ou SKU…" oninput="filterProductTable(this.value)"><datalist id="productSuggestions">${data.products.map(p=>`<option value="${esc(p.name)}">${esc(p.sku)}</option>`).join('')}</datalist></label>`;catalog.insertBefore(search,table.parentElement);[...table.querySelectorAll('tr')].slice(1).forEach((row,index)=>{let product=data.products[index],cell=row.lastElementChild,edit=cell?.querySelector('button');if(!product||!cell||!edit)return;row.dataset.search=(product.name+' '+product.sku).toLowerCase();let remove=document.createElement('button');remove.className='secondary';remove.style='margin-left:6px;color:#a61b1b';remove.textContent='Supprimer';remove.onclick=()=>deleteProduct(product.id);cell.appendChild(remove)})}
function filterProductTable(value){let q=String(value).trim().toLowerCase();document.querySelectorAll('#admin-content table tr[data-search]').forEach(row=>row.style.display=!q||row.dataset.search.includes(q)?'':'none')}
async function deleteProduct(id){let product=data.products.find(p=>p.id===id);if(!product||!confirm(`Supprimer définitivement « ${product.name} » ?\nLes commandes historiques seront conservées.`))return;try{await api('/api/admin/products/'+id,{method:'DELETE'});toast('Produit supprimé');await load()}catch(err){toast(err.message)}}
function qrLink(l){return `${location.origin}/?location=${encodeURIComponent(l.id)}&token=${encodeURIComponent(l.token)}`}
function renderQrLocations(){let e=$('#admin-content');if(!e)return;e.innerHTML=`<div class="two grid"><form class="card" onsubmit="createQrLocation(event)"><h2>Créer un lien QR</h2><p class="small muted">Créez un emplacement pour une piste, une table, une salle ou une tablette.</p><label>Nom de l'emplacement<input id="qrLabel" placeholder="Ex. Piste 9 ou Table terrasse 2" maxlength="80" required></label><br><button>Créer le lien</button></form><section class="card"><h2>Liens QR existants</h2><div style="overflow:auto"><table><tr><th>Emplacement</th><th>Lien client</th><th>Actions</th></tr>${data.lanes.map(l=>`<tr><td><b>${esc(l.label||`Piste ${l.number}`)}</b><br><span class="status ${l.active?'SERVED':'CANCELLED'}">${l.active?'Actif':'Inactif'}</span></td><td><div class="qr">${esc(qrLink(l))}</div></td><td><div class="tabs"><button type="button" class="secondary" onclick="copyQrLink('${l.id}')">Copier</button><button type="button" class="secondary" onclick="renameQrLocation('${l.id}')">Renommer</button><button type="button" class="secondary" onclick="regenerateQrLink('${l.id}')">Nouveau lien</button><button type="button" class="secondary" onclick="lane('${l.id}',${!l.active})">${l.active?'Désactiver':'Activer'}</button><button type="button" style="background:#a61b1b" onclick="deleteQrLocation('${l.id}')">Supprimer</button></div></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Aucun emplacement.</td></tr>'}</table></div></section></div>`}
async function createQrLocation(e){e.preventDefault();try{await api('/api/admin/lanes',{method:'POST',body:JSON.stringify({label:$('#qrLabel').value})});toast('Lien QR créé');await load()}catch(err){toast(err.message)}}
async function copyQrLink(id){let l=data.lanes.find(x=>x.id===id);if(!l)return;try{await navigator.clipboard.writeText(qrLink(l));toast('Lien copié')}catch{prompt('Copiez ce lien',qrLink(l))}}
async function renameQrLocation(id){let l=data.lanes.find(x=>x.id===id),label=prompt("Nom de l'emplacement",l?.label||`Piste ${l?.number}`);if(!l||label===null)return;try{await api('/api/admin/lanes',{method:'PATCH',body:JSON.stringify({id,label})});await load()}catch(err){toast(err.message)}}
async function regenerateQrLink(id){if(!confirm("L'ancien QR code ne fonctionnera plus. Générer un nouveau lien ?"))return;try{await api('/api/admin/lanes',{method:'PATCH',body:JSON.stringify({id,regenerateToken:true})});toast('Nouveau lien généré');await load()}catch(err){toast(err.message)}}
async function deleteQrLocation(id){let l=data.lanes.find(x=>x.id===id);if(!l||!confirm(`Supprimer définitivement « ${l.label||`Piste ${l.number}`} » ?`))return;try{await api('/api/admin/lanes/'+id,{method:'DELETE'});toast('Lien QR supprimé');await load()}catch(err){toast(err.message)}}
function renderCategoryManager(){let e=$('#admin-content'),roots=data.categories.filter(c=>!c.parentId).sort((a,b)=>a.sort-b.sort);if(!e)return;e.innerHTML=`<div class="two grid"><form class="card" onsubmit="newCategory(event)"><h2>Ajouter une catégorie</h2><label>Nom<input id="cn" required></label><label>Icône<input id="ci" value="📦"></label><label>Niveau<select id="cp"><option value="">Univers principal</option>${roots.map(c=>`<option value="${c.id}">Sous-catégorie de ${esc(c.name)}</option>`).join('')}</select></label><label>Ordre<input id="cs" type="number" value="${data.categories.length+1}"></label><button>Ajouter</button></form><section class="card"><h2>Catégories et produits</h2>${roots.map(root=>`<div style="margin-bottom:18px"><div class="row"><b>${root.icon} ${esc(root.name)}</b><button class="secondary" onclick="openCategoryEditor('${root.id}')">Modifier</button></div>${data.categories.filter(c=>c.parentId===root.id).sort((a,b)=>a.sort-b.sort).map(c=>`<div class="row" style="padding:8px 0 8px 20px;border-bottom:1px solid #e7eaf0"><span>${c.icon} <b>${esc(c.name)}</b> <span class="small muted">${data.products.filter(p=>p.categoryId===c.id).length} produit(s)</span></span><button class="secondary" onclick="openCategoryEditor('${c.id}')">Gérer</button></div>`).join('')||'<p class="small muted">Aucune sous-catégorie.</p>'}</div>`).join('')}</section></div>`}
function enhanceCategorySearch(){let section=document.querySelector('#admin-content section.card');if(!section)return;let box=document.createElement('label');box.innerHTML=`Rechercher une catégorie<input list="categorySuggestions" placeholder="Nom de catégorie…" oninput="filterCategories(this.value)"><datalist id="categorySuggestions">${data.categories.map(c=>`<option value="${esc(c.name)}"></option>`).join('')}</datalist>`;section.insertBefore(box,section.children[1]||null);section.querySelectorAll('button[onclick^="openCategoryEditor"]').forEach(button=>{let id=button.getAttribute('onclick').match(/'([^']+)'/)?.[1],row=button.closest('.row'),container=row?.parentElement;if(container)container.dataset.categorySearch=container.textContent.toLowerCase();if(id){let remove=document.createElement('button');remove.type='button';remove.className='danger';remove.textContent='Supprimer';remove.onclick=()=>openCategoryDelete(id);button.after(remove)}})}
function filterCategories(value){let q=String(value).trim().toLowerCase();document.querySelectorAll('[data-category-search]').forEach(block=>block.style.display=!q||block.dataset.categorySearch.includes(q)?'':'none')}
function openCategoryDelete(id){let c=data.categories.find(x=>x.id===id),children=data.categories.filter(x=>x.parentId===id),products=data.products.filter(x=>x.categoryId===id),replacements=data.categories.filter(x=>x.parentId&&x.id!==id),modal=document.createElement('div');if(!c)return;modal.id='categoryDelete';modal.style='position:fixed;inset:0;z-index:1200;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:20px';modal.onclick=e=>{if(e.target===modal)modal.remove()};modal.innerHTML=`<section class="card" style="width:min(520px,100%)"><h2>Supprimer « ${esc(c.name)} »</h2>${children.length?`<p>Cette catégorie contient ${children.length} sous-catégorie(s). Supprimez ou déplacez-les avant de supprimer cette catégorie.</p><button type="button" class="secondary" onclick="categoryDelete.remove()">Fermer</button>`:`<p>${products.length?`${products.length} produit(s) doivent être déplacés avant la suppression.`:'Cette action supprimera définitivement la catégorie.'}</p>${products.length?`<label>Catégorie de remplacement<select id="directCategoryReplacement" required><option value="">Choisir…</option>${replacements.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></label>`:''}<div class="row" style="margin-top:18px"><button type="button" class="secondary" onclick="categoryDelete.remove()">Annuler</button><button type="button" class="danger" onclick="confirmCategoryDelete('${id}')">Supprimer définitivement</button></div>`}</section>`;document.body.appendChild(modal)}
async function confirmCategoryDelete(id){let c=data.categories.find(x=>x.id===id),products=data.products.filter(x=>x.categoryId===id),replacementCategoryId=$('#directCategoryReplacement')?.value||'';if(products.length&&!replacementCategoryId)return toast('Choisissez une catégorie de remplacement.');if(!c||!confirm(`Confirmer la suppression de « ${c.name} » ?`))return;try{await api('/api/admin/categories/'+id,{method:'DELETE',body:JSON.stringify({replacementCategoryId})});document.querySelector('#categoryDelete')?.remove();toast('Catégorie supprimée');await load()}catch(err){toast(err.message)}}
function openCategoryEditor(id){let c=data.categories.find(x=>x.id===id),isRoot=!c.parentId,roots=data.categories.filter(x=>!x.parentId&&x.id!==id),replacements=data.categories.filter(x=>x.parentId&&x.id!==id),modal=document.createElement('div');modal.id='categoryEditor';modal.style='position:fixed;inset:0;z-index:1100;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:20px';modal.onclick=e=>{if(e.target===modal)modal.remove()};modal.innerHTML=`<form class="card" onsubmit="saveCategoryEditor(event,'${id}')" style="width:min(720px,100%);max-height:92vh;overflow:auto"><div class="row"><h2>Modifier la catégorie</h2><button type="button" class="secondary" onclick="categoryEditor.remove()">Fermer</button></div><label>Nom<input id="categoryName" value="${esc(c.name)}" required></label><div class="row"><label>Icône<input id="categoryIcon" value="${esc(c.icon||'📦')}"></label><label>Ordre<input id="categorySort" type="number" value="${c.sort||1}"></label></div><label>Univers parent<select id="categoryParent" ${isRoot?'disabled':''}><option value="">Univers principal</option>${roots.map(r=>`<option value="${r.id}" ${r.id===c.parentId?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label><p><label><input id="categoryActive" type="checkbox" style="width:auto" ${c.active?'checked':''}> Catégorie active</label></p>${!isRoot?`<label>Produits à placer dans cette catégorie<select id="categoryProducts" multiple size="12">${data.products.map(p=>`<option value="${p.id}" ${p.categoryId===id?'selected':''}>${esc(p.sku)} · ${esc(p.name)}</option>`).join('')}</select></label><p class="small muted">Ctrl + clic pour sélectionner plusieurs produits. Les produits sélectionnés seront déplacés ici.</p>`:''}<div class="row"><button>Enregistrer</button><button type="button" style="background:#a61b1b" onclick="deleteCategory('${id}')">Supprimer</button></div>${!isRoot?`<label class="small">Catégorie de remplacement en cas de suppression<select id="categoryReplacement"><option value="">Choisir…</option>${replacements.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></label>`:''}</form>`;document.body.appendChild(modal)}
const categoryEditorWithoutProductSearch=openCategoryEditor;
openCategoryEditor=function(id){categoryEditorWithoutProductSearch(id);let select=$('#categoryProducts');if(!select)return;let search=document.createElement('input');search.setAttribute('list','categoryProductSuggestions');search.placeholder='Rechercher un produit par nom ou SKU…';search.oninput=()=>filterSelectOptions(select,search.value);let list=document.createElement('datalist');list.id='categoryProductSuggestions';list.innerHTML=data.products.map(p=>`<option value="${esc(p.name)}">${esc(p.sku)}</option>`).join('');select.parentElement.insertBefore(search,select);select.parentElement.appendChild(list)};
function filterSelectOptions(select,value){let q=String(value).trim().toLowerCase();[...select.options].forEach(option=>option.hidden=!!q&&!option.textContent.toLowerCase().includes(q))}
async function saveCategoryEditor(e,id){e.preventDefault();try{await api('/api/admin/categories/'+id,{method:'PATCH',body:JSON.stringify({name:$('#categoryName').value,icon:$('#categoryIcon').value,sort:$('#categorySort').value,parentId:$('#categoryParent')?.value,active:$('#categoryActive').checked,productIds:selectedIds('#categoryProducts')})});document.querySelector('#categoryEditor')?.remove();toast('Catégorie enregistrée');await load()}catch(err){toast(err.message)}}
async function deleteCategory(id){let c=data.categories.find(x=>x.id===id);if(!c||!confirm(`Supprimer définitivement « ${c.name} » ?`))return;try{await api('/api/admin/categories/'+id,{method:'DELETE',body:JSON.stringify({replacementCategoryId:$('#categoryReplacement')?.value||''})});document.querySelector('#categoryEditor')?.remove();toast('Catégorie supprimée');await load()}catch(err){toast(err.message)}}
function optionSetProductOptions(setId=''){return data.products.map(p=>`<option value="${p.id}" ${(p.optionSetIds||[]).includes(setId)?'selected':''}>${esc(p.sku)} · ${esc(p.name)}</option>`).join('')}
function choiceRowsHtml(choices=[],prefix='new'){return (choices.length?choices:[{name:'',priceTtcDelta:0}]).map(c=>`<div class="row option-choice-row" style="margin:6px 0"><input class="choice-name" placeholder="Nom du choix" value="${esc(c.name||'')}" required><input class="choice-price" type="number" step=".01" value="${Number(c.priceTtcDelta||0)}" placeholder="Supplément TTC" title="Supplément TTC"><button type="button" class="secondary" onclick="this.closest('.option-choice-row').remove()">Supprimer</button></div>`).join('')}
function optionSetFields(prefix,group={name:'',required:true,choices:[]}){return `<label>Question affichée au client<input id="${prefix}GroupName" value="${esc(group.name||'')}" placeholder="Ex. Parfum du sirop" required></label><p><label><input id="${prefix}Required" type="checkbox" style="width:auto" ${group.required!==false?'checked':''}> Choix obligatoire</label></p><div id="${prefix}Choices">${choiceRowsHtml(group.choices,prefix)}</div><button type="button" class="secondary" onclick="addVisualChoice('${prefix}Choices')">+ Ajouter un choix</button>`}
function addVisualChoice(containerId){let container=$('#'+containerId),row=document.createElement('div');row.className='row option-choice-row';row.style='margin:6px 0';row.innerHTML=`<input class="choice-name" placeholder="Nom du choix" required><input class="choice-price" type="number" step=".01" value="0" placeholder="Supplément TTC"><button type="button" class="secondary" onclick="this.closest('.option-choice-row').remove()">Supprimer</button>`;container.appendChild(row)}
function readVisualGroup(prefix){let rows=[...document.querySelectorAll(`#${prefix}Choices .option-choice-row`)],name=$('#'+prefix+'GroupName').value.trim();return {id:optionId(name,0),name,required:$('#'+prefix+'Required').checked,choices:rows.map((row,i)=>{let choiceName=row.querySelector('.choice-name').value.trim();return {id:optionId(choiceName,i),name:choiceName,priceTtcDelta:Number(row.querySelector('.choice-price').value)||0}}).filter(c=>c.name)}}
function renderOptionSetManager(){let e=$('#admin-content'),sets=data.optionSets||[];if(!e)return;e.innerHTML=`<div class="two grid"><form class="card" onsubmit="createOptionSet(event)"><h2>Nouveau jeu d'options</h2><label>Nom du jeu<input id="setName" placeholder="Ex. Choix du sirop" required></label>${optionSetFields('new')}<label style="margin-top:14px">Rechercher un produit<input list="optionProductSuggestions" placeholder="Nom ou SKU…" oninput="filterSelectOptions($('#setProducts'),this.value)"></label><datalist id="optionProductSuggestions">${data.products.map(p=>`<option value="${esc(p.name)}">${esc(p.sku)}</option>`).join('')}</datalist><label>Produits concernés<select id="setProducts" multiple size="12">${optionSetProductOptions()}</select></label><p class="small muted">Ctrl + clic pour sélectionner plusieurs cocktails.</p><button>Créer le jeu</button></form><section class="card"><h2>Jeux existants</h2>${sets.map(set=>`<article style="padding:12px 0;border-bottom:1px solid #e7eaf0"><div class="row"><div><b>${esc(set.name)}</b><br><span class="small muted">${data.products.filter(p=>(p.optionSetIds||[]).includes(set.id)).length} produit(s) · ${set.groups.reduce((n,g)=>n+g.choices.length,0)} choix</span></div><div><button class="secondary" onclick="openOptionSetEditor('${set.id}')">Modifier</button> <button style="background:#a61b1b" onclick="deleteOptionSet('${set.id}')">Supprimer</button></div></div></article>`).join('')||'<p class="empty">Aucun jeu d’options.</p>'}</section></div>`}
async function createOptionSet(e){e.preventDefault();try{await api('/api/admin/option-sets',{method:'POST',body:JSON.stringify({name:$('#setName').value,groups:[readVisualGroup('new')],productIds:selectedIds('#setProducts')})});toast("Jeu d'options créé");await load()}catch(err){toast(err.message)}}
function openOptionSetEditor(id){let set=(data.optionSets||[]).find(s=>s.id===id),group=set.groups[0]||{},modal=document.createElement('div');modal.id='optionSetEditor';modal.style='position:fixed;inset:0;z-index:1100;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:20px';modal.onclick=e=>{if(e.target===modal)modal.remove()};modal.innerHTML=`<form class="card" onsubmit="saveOptionSet(event,'${id}')" style="width:min(760px,100%);max-height:92vh;overflow:auto"><div class="row"><h2>Modifier le jeu</h2><button type="button" class="secondary" onclick="optionSetEditor.remove()">Fermer</button></div><label>Nom du jeu<input id="editSetName" value="${esc(set.name)}" required></label>${optionSetFields('edit',group)}<label style="margin-top:14px">Rechercher un produit<input list="editOptionProductSuggestions" placeholder="Nom ou SKU…" oninput="filterSelectOptions($('#editSetProducts'),this.value)"></label><datalist id="editOptionProductSuggestions">${data.products.map(p=>`<option value="${esc(p.name)}">${esc(p.sku)}</option>`).join('')}</datalist><label>Cocktails et produits concernés<select id="editSetProducts" multiple size="14">${optionSetProductOptions(id)}</select></label><p class="small muted">La modification s'appliquera à tous les produits sélectionnés.</p><button>Enregistrer</button></form>`;document.body.appendChild(modal)}

const renderBeforeCartCleanup=render;render=function(){if(view!=='client'){document.querySelector('#openCartButton')?.remove();document.querySelector('.cart-panel-overlay')?.remove()}renderBeforeCartCleanup()};
const CART_STORAGE_KEY='mbwp-cart';let cartIdleTimer=null,cartWarningTimer=null,cartWarningRemaining=15;
try{let saved=JSON.parse(localStorage.getItem(CART_STORAGE_KEY)||'[]');if(Array.isArray(saved))cart=saved}catch{localStorage.removeItem(CART_STORAGE_KEY)}
function persistCart(){localStorage.setItem(CART_STORAGE_KEY,JSON.stringify(cart));localStorage.setItem('mbwp-cart-updated',String(Date.now()));scheduleCartIdleWarning()}
function scheduleCartIdleWarning(){clearTimeout(cartIdleTimer);if(!cart.length||document.querySelector('#cartIdleWarning'))return;cartIdleTimer=setTimeout(showCartIdleWarning,60000)}
function showCartIdleWarning(){if(!cart.length)return;cartWarningRemaining=15;let modal=document.createElement('div');modal.id='cartIdleWarning';modal.style='position:fixed;inset:0;z-index:1300;background:rgba(15,23,42,.78);display:flex;align-items:center;justify-content:center;padding:20px';modal.innerHTML=`<section class="card" style="width:min(480px,100%);text-align:center"><h2>Votre panier est toujours là</h2><p>Sans activité, il sera vidé dans <b id="cartIdleCountdown">15</b> secondes.</p><div class="row"><button type="button" class="secondary" onclick="clearCartAfterIdle()">Vider maintenant</button><button type="button" onclick="keepCartAfterWarning()">Conserver mon panier</button></div></section>`;document.body.appendChild(modal);cartWarningTimer=setInterval(()=>{cartWarningRemaining--;let count=$('#cartIdleCountdown');if(count)count.textContent=Math.max(0,cartWarningRemaining);if(cartWarningRemaining<=0)clearCartAfterIdle()},1000)}
function keepCartAfterWarning(){clearInterval(cartWarningTimer);document.querySelector('#cartIdleWarning')?.remove();scheduleCartIdleWarning()}
function clearCartAfterIdle(){clearInterval(cartWarningTimer);clearTimeout(cartIdleTimer);document.querySelector('#cartIdleWarning')?.remove();cart=[];persistCart();render();toast('Panier vidé après inactivité.')}
const adjustBeforePersistence=adjust;adjust=function(id,n){adjustBeforePersistence(id,n);persistCart()};
const addBeforePersistence=add;add=function(id){addBeforePersistence(id);persistCart()};
['pointerdown','keydown','touchstart'].forEach(type=>document.addEventListener(type,()=>{if(!document.querySelector('#cartIdleWarning'))scheduleCartIdleWarning()},{passive:true}));
scheduleCartIdleWarning();
</script></body></html>
